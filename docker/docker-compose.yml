# Local development: PostgreSQL + Redis only.
# Run the API, web, and agent on the host with `pnpm dev`, pointing DATABASE_URL / REDIS_URL at these services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vesta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vesta
      POSTGRES_PASSWORD: vesta
      POSTGRES_DB: vesta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vesta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
